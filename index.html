<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo | Share Mod Hack Game & iOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #030014;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        /* Hiệu ứng nền không gian sao bay */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
            z-index: 2;
            position: relative;
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
        }
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #38bdf8, #818cf8, #c084fc);
            z-index: -1;
            animation: spin 6s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0f172a;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 4px;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 12px;
        }
        p.bio {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
            line-height: 1.5;
        }
        .section-title {
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-left: 5px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .link-btn {
            background: rgba(30, 41, 59, 0.8);
            color: #f8fafc;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .link-left {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .link-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .link-info .title {
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
        }
        .link-info .desc {
            font-size: 11px;
            color: #94a3b8;
        }
        .link-btn::after {
            content: '↗';
            font-size: 16px;
            color: #38bdf8;
            transition: transform 0.3s ease;
        }
        .link-btn:hover {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(192, 132, 252, 0.2));
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
        }
        .link-btn:hover::after {
            transform: translate(2px, -2px);
        }
        .footer {
            margin-top: 15px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <div class="avatar-wrapper">
            <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="Avatar" class="avatar">
        </div>
        
        <h1>Bảo</h1>
        <div class="badge">✦ Share Mod Hack Game & iOS ✦</div>
        <p class="bio">Chuyên chia sẻ mod hack game, thủ thuật iOS và tool độc quyền.</p>

        <div class="links">
            <a href="https://www.tiktok.com/@qbaosharemodhacgame" class="link-btn" target="_blank">
                <div class="link-left">
                    <img src="https://sf16-scm.tiktokcdn.com/obj/eden-cn/ptlz_lvZ/ljhwZthlaukjlkulzlp/tiktok-icon2.png" alt="TikTok" class="link-icon" style="background:#000; padding: 6px;">
                    <div class="link-info">
                        <div class="title">TikTok Chính Chủ</div>
                        <div class="desc">@qbaosharemodhacgame</div>
                    </div>
                </div>
            </a>
        </div>

        <div class="section-title">Tải IPA & Tool Hot</div>
        
        <div class="links">
            <a href="https://link4sub.com/YbXDtn1fYg" class="link-btn" target="_blank">
                <div class="link-left">
                    <img src="https://i.ibb.co/1Z65w3G/fox.png" alt="App 3105" class="link-icon" onerror="this.src='https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'">
                    <div class="link-info">
                        <div class="title">App 3105 (iOS)</div>
                        <div class="desc">Quản lý dữ liệu, patch & dọn rác</div>
                    </div>
                </div>
            </a>

            <a href="https://link4sub.com/Yf47XaASAc" class="link-btn" target="_blank">
                <div class="link-left">
                    <img src="https://i.ibb.co/Vvz8P8f/120hz.png" alt="120Hz" class="link-icon" onerror="this.src='https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'">
                    <div class="link-info">
                        <div class="title">Unlock 120Hz iOS</div>
                        <div class="desc">Giúp màn hình siêu mượt mà</div>
                    </div>
                </div>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 Bảo • Build with AI số 1 thế giới
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        const particles = [];
        const count = 40;

        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5 + 0.5,
                speedY: Math.random() * 0.6 + 0.2,
                opacity: Math.random()
            });
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#38bdf8';

            particles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speedY;
                if (p.y < 0) {
                    p.y = height;
                    p.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
