<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo | Official Bio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #030014;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        /* Hiệu ứng nền không gian / lưới ảo */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
            z-index: 2;
            position: relative;
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
        }
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #38bdf8, #818cf8, #c084fc);
            z-index: -1;
            animation: spin 6s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0f172a;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 6px;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 15px;
        }
        p.bio {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .link-btn {
            background: rgba(30, 41, 59, 0.7);
            color: #f8fafc;
            text-decoration: none;
            padding: 15px 22px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .link-btn span {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .link-btn::after {
            content: '→';
            font-size: 16px;
            transition: transform 0.3s ease;
            color: #38bdf8;
        }
        .link-btn:hover {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(192, 132, 252, 0.2));
            border-color: #38bdf8;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
        }
        .link-btn:hover::after {
            transform: translateX(5px);
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <!-- Avatar có viền cầu vồng xoay -->
        <div class="avatar-wrapper">
            <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="Avatar" class="avatar">
        </div>
        
        <h1>Bảo</h1>
        <div class="badge">✦ Share Mod Hack Game & iOS ✦</div>
        <p class="bio">Chuyên chia sẻ mod hack game, thủ thuật iOS và các tool hay ho. Nhấn vào các kênh bên dưới để kết nối với mình nhé!</p>

        <div class="links">
            <a href="https://www.tiktok.com/@qbaosharemodhacgame" class="link-btn" target="_blank">
                <span>TikTok Official</span>
            </a>
            <a href="https://facebook.com" class="link-btn" target="_blank">
                <span>Facebook Cá Nhân</span>
            </a>
            <a href="https://github.com" class="link-btn" target="_blank">
                <span>GitHub Repository</span>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 Bảo • Built with Gemini
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        const particles = [];
        const count = 40;

        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5 + 0.5,
                speedY: Math.random() * 0.6 + 0.2,
                opacity: Math.random()
            });
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#38bdf8';

            particles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speedY;
                if (p.y < 0) {
                    p.y = height;
                    p.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
